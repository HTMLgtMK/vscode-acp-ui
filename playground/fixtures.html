<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACP UI fixtures</title>
    <style>
      :root {
                                color-scheme: dark;
                                --bg: #282c34;
                                --panel: #21252b;
                                --border: #3a3f4b;
                                --text: #abb2bf;
                                --heading: #d7dae0;
                                --accent: #35a854;
                                --accent-hover: #35974f;
                                --muted: #636e83;
                                font-family:
                                  ui-monospace, Consolas, "Cascadia Code", "Courier New", monospace;
                              }

                              * {
                                box-sizing: border-box;
                              }

                              body {
                                margin: 0;
                                min-height: 100%;
                                background: var(--bg);
                                color: var(--text);
                              }

                              .fixtures-page {
                                max-width: 52rem;
                                margin: 0 auto;
                                padding: 2rem 1.25rem 3rem;
                              }

                              .fixtures-header {
                                display: flex;
                                flex-wrap: wrap;
                                align-items: baseline;
                                justify-content: space-between;
                                gap: 0.75rem 1rem;
                                margin-bottom: 2rem;
                              }

                              .fixtures-header h1 {
                                margin: 0;
                                color: var(--heading);
                                font-size: 1.35rem;
                                font-weight: 600;
                              }

                              .fixtures-back {
                                color: var(--accent);
                                text-decoration: none;
                              }

                              .fixtures-back:hover {
                                color: var(--accent-hover);
                              }

                              .fixtures-section {
                                margin-bottom: 2rem;
                              }

                              .fixtures-section h2 {
                                margin: 0 0 0.75rem;
                                color: var(--heading);
                                font-size: 0.95rem;
                                font-weight: 600;
                                letter-spacing: 0.02em;
                                text-transform: uppercase;
                              }

                              .fixtures-list {
                                list-style: none;
                                margin: 0;
                                padding: 0;
                                border: 1px solid var(--border);
                                border-radius: 6px;
                                overflow: hidden;
                                background: var(--panel);
                              }

                              .fixtures-item + .fixtures-item {
                                border-top: 1px solid var(--border);
                              }

                              .fixtures-link {
                                display: block;
                                padding: 0.9rem 1rem;
                                color: inherit;
                                text-decoration: none;
                              }

                              .fixtures-link:hover {
                                background: #3e445188;
                              }

                              .fixtures-link-title {
                                display: block;
                                color: var(--heading);
                                font-weight: 600;
                                margin-bottom: 0.25rem;
                              }

                              .fixtures-link-desc {
                                display: block;
                                color: var(--muted);
                                font-size: 0.85rem;
                                line-height: 1.45;
                              }

                              .fixtures-status,
                              .fixtures-error {
                                color: var(--muted);
                                font-size: 0.9rem;
                              }

                              .fixtures-error {
                                color: #e06c75;
                              }
    </style>
  </head>
  <body>
    <main class="fixtures-page">
      <header class="fixtures-header">
        <h1>ACP UI fixtures</h1>
        <a class="fixtures-back" href="/">Back to chat</a>
      </header>
      <p id="fixtures-status" class="fixtures-status">Loading fixtures...</p>
      <div id="fixtures-root" hidden></div>
    </main>
    <script type="module" src="./src/fixtures-page.ts"></script>
  </body>
</html>
